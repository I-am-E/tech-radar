name: Hourly Tech Radar
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fresh public RSS signals
        run: python scripts/update.py
      - name: Run lightweight optimisation checks
        run: python scripts/optimize.py
      - name: Commit worthwhile changes
        run: |
          git config user.name "tech-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then echo "No useful change this hour."; exit 0; fi
          git add posts.json CHANGELOG.md index.html styles.css app.js
          git commit -m "chore: hourly radar update"
          git push
